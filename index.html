<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice Safety Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f7f9;color:#111}
.top{background:#000;color:#fff;padding:18px 16px 20px;text-align:center}
.top h1{font-size:20px;margin:0}
.top p{font-size:13px;opacity:.8;margin:6px 0 0}
.wrap{max-width:520px;margin:-10px auto 0;padding:0 14px 30px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:12px}
.label{font-size:13px;font-weight:700;margin:12px 0 6px}
.label:first-child{margin-top:0}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#000}
textarea{min-height:140px;resize:vertical}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:#000;color:#fff;font-size:16px;font-weight:700;margin-top:14px}
.btn:active{opacity:.85}
.result{margin-top:14px;border-radius:12px;padding:14px;font-size:14px;line-height:1.6;display:none}
.result.safe{background:#e8f8ec;border:1px solid #b6e3c0}
.result.danger{background:#fdecec;border:1px solid #f5b5b5}
.result h3{margin:0 0 8px;font-size:16px}
.small{font-size:12px;color:#666;text-align:center;margin-top:14px;line-height:1.5}
.row{display:flex;gap:10px}
.row>div{flex:1}
.tag{display:inline-block;font-size:11px;padding:4px 8px;border-radius:20px;background:#eef2ff;color:#333;margin:2px 2px 0 0}
</style>
</head>
<body>

<div class="top">
  <h1>Invoice Safety Checker</h1>
  <p>Safety check ONLY • No payments • No cards</p>
</div>

<div class="wrap">
  <div class="card">
    <div class="label">1. Paste invoice text</div>
    <textarea id="invoiceText" placeholder="Paste full invoice text..."></textarea>

    <div class="label">2. Company name on invoice</div>
    <input id="companyName" placeholder="e.g. QVS Trading Ltd">

    <div class="label">3. Bank account name (beneficiary)</div>
    <input id="bankName" placeholder="e.g. John Smith or ABC Ltd">

    <div class="label">4. IBAN / Account country</div>
    <div class="row">
      <div><input id="iban" placeholder="IBAN e.g. DE89..."></div>
      <div>
        <select id="bankCountry">
          <option value="">Bank country...</option>
          <option value="DE">Germany (DE)</option>
          <option value="GB">UK (GB)</option>
          <option value="FR">France (FR)</option>
          <option value="IT">Italy (IT)</option>
          <option value="ES">Spain (ES)</option>
          <option value="NL">Netherlands (NL)</option>
          <option value="AE">UAE (AE)</option>
          <option value="US">USA (US)</option>
          <option value="TR">Turkey (TR)</option>
          <option value="CN">China (CN)</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
    </div>

    <button class="btn" onclick="checkInvoice()">Check Invoice →</button>
    <div id="result" class="result"></div>
  </div>
  <p class="small">Always verify bank details by calling the company on its official website number before paying.</p>
</div>

<script>
const countryNames = {DE:'Germany',GB:'UK',FR:'France',IT:'Italy',ES:'Spain',NL:'Netherlands',AE:'UAE',US:'USA',TR:'Turkey',CN:'China'};

function cleanName(s){
  return s.toLowerCase().replace(/ltd|limited|llc|inc|gmbh|co\.|company|trading|group/g,'').replace(/[^a-z0-9 ]/g,'').trim();
}
function checkInvoice(){
  const text = document.getElementById('invoiceText').value.toLowerCase();
  const company = document.getElementById('companyName').value.trim();
  const beneficiary = document.getElementById('bankName').value.trim();
  const iban = document.getElementById('iban').value.trim().toUpperCase().replace(/\s/g,'');
  const bankCountry = document.getElementById('bankCountry').value;
  const box = document.getElementById('result');
  box.style.display='block';
  let flags = [];
  let infos = [];

  if(!text.trim()){
    box.className='result danger';
    box.innerHTML='<h3>Paste an invoice first</h3>';
    return;
  }

  // Old checks
  if(text.includes('myshopify') || text.includes('shopify') || text.includes('pay by link') || text.includes('pay by qr'))
    flags.push('Pay-by-link / Shopify checkout for B2B invoice - real B2B uses bank transfer');
  if(text.includes('account might be change') || text.includes('might be change') || text.includes('account might change') || text.includes('account may change'))
    flags.push('Bank account "might change" - classic scam line');
  if(text.includes('passport'))
    flags.push('Passport number on invoice - real invoices do not include this');
  if(text.includes('cis') || text.includes('contact of issuer'))
    flags.push('CIS provided by sender - do not trust it. Verify via bank official website only');

  // NEW 1: Company vs Beneficiary mismatch
  if(company && beneficiary){
    const c = cleanName(company);
    const b = cleanName(beneficiary);
    const cWords = c.split(' ').filter(w=>w.length>3);
    const match = cWords.some(w=>b.includes(w));
    if(!match){
      flags.push(`Name mismatch: Invoice company is "${company}" but bank account is "${beneficiary}" - real suppliers pay to same company name`);
    } else {
      infos.push('Company name matches bank account name');
    }
  }

  // NEW 2: IBAN country vs selected bank country
  if(iban.length >= 2 && bankCountry && bankCountry !== 'OTHER'){
    const ibanCountry = iban.slice(0,2);
    if(ibanCountry !== bankCountry){
      flags.push(`IBAN country mismatch: IBAN starts with ${ibanCountry} but you selected bank country ${bankCountry} (${countryNames[bankCountry]||bankCountry})`);
    } else {
      infos.push(`IBAN country matches: ${ibanCountry} = ${countryNames[bankCountry]||bankCountry}`);
    }
    // IBAN length basic check
    if(iban.length < 15 || iban.length > 34) flags.push('IBAN length looks wrong - should be 15-34 characters');
  }
  if(iban && !bankCountry) infos.push('Tip: select bank country to check IBAN match');

  if(flags.length === 0){
    box.className='result safe';
    box.innerHTML='<h3>✅ No obvious red flags found</h3>' + infos.map(i=>'<div>• '+i+'</div>').join('') + '<br>Still verify bank details on official number before paying.';
  } else {
    box.className='result danger';
    box.innerHTML='<h3>⛔ DO NOT PROCEED</h3>' + flags.map(f=>'<div>• '+f+'</div>').join('') + (infos.length?'<br><b>Checks passed:</b><br>'+infos.map(i=>'<div>• '+i+'</div>').join(''):'');
  }
  window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
}
</script>
</body>
</html>
